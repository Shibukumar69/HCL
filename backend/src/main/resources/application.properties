# Server Configuration
server.port=5000

# Spring Application Name
spring.application.name=retail-inventory-backend

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:retail}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:9508Shibu}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson / JSON Configuration (preserve snake_case & ISO date times)
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# JWT Security Configuration
jwt.secret=${JWT_SECRET:mySuperSecretJwtKeyRetailInventory2026mySuperSecretJwtKeyRetailInventory2026}
jwt.expiration-ms=604800000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.retail.inventory=DEBUG
