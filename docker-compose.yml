services:
  # 1. MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: retail_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: retail
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - retail_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_backend_api
    restart: always
    environment:
      PORT: 5000
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: retail
      DB_PORT: 3306
      JWT_SECRET: superSecretRetailInventoryKey2026
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - retail_network

  # 3. Angular Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail_frontend_ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - retail_network

volumes:
  mysql_data:

networks:
  retail_network:
    driver: bridge
