name: Retail Inventory Management CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Backend CI Job (Java Spring Boot 3 + Maven)
  backend-ci:
    name: ☕ Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔧 Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: 🧪 Run Backend Unit & Integration Tests
        working-directory: backend
        run: ./mvnw clean test -B

      - name: 📦 Package Spring Boot Executable JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests -B

      - name: 📤 Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # 2. Frontend CI Job (Angular 19 + Node.js)
  frontend-ci:
    name: 🅰️ Frontend Build & Lint (Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🚀 Build Production Angular Bundle
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: 📤 Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 7

  # 3. Docker Containerization Validation
  docker-validation:
    name: 🐳 Docker Compose & Container Build
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Validate Docker Compose Configuration
        run: docker compose config

      - name: 🏗️ Build All Docker Images (MySQL + Spring Boot + Nginx)
        run: docker compose build
